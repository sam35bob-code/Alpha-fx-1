name: Build AlphaFX APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Find project
        run: |
          ls -la
          find . -name "gradlew" -type f
          PROJECT_DIR=$(find . -name "gradlew" -type f | head -n 1 | xargs dirname)
          if [ -z "$PROJECT_DIR" ]; then PROJECT_DIR="."; fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Using: $PROJECT_DIR"
          ls -la $PROJECT_DIR

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK
        run: |
          cd "${{ env.PROJECT_DIR }}"
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AlphaFX-APK
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
