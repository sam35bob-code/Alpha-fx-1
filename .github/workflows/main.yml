name: Build AlphaFX APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          set -x
          ls -la
          # Make sure we unzip if zip still exists
          if [ -f "alphafx (1).zip" ]; then
            unzip -o "alphafx (1).zip" -d .
            ls -la
          fi
          for f in *.zip; do
            [ -e "$f" ] || continue
            echo "Unzipping $f"
            unzip -o "$f" -d .
          done
          ls -la
          find . -maxdepth 3 -type f -name "gradlew" || echo "no gradlew"
          # If gradlew exists use it, else use gradle
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          elif [ -f "*/gradlew" ]; then
            GRADLEW=$(find . -name "gradlew" | head -n 1)
            chmod +x "$GRADLEW"
            $(dirname $GRADLEW)/gradlew assembleDebug --stacktrace || gradle assembleDebug --stacktrace
          else
            echo "Using system gradle"
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AlphaFX-APK
          path: |
            **/app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/*.apk
