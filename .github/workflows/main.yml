name: Build AlphaFX APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with: { java-version: '17', distribution: 'temurin' }
      - uses: gradle/actions/setup-gradle@v4
        
      - name: Build APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          
          # Create keystore everywhere
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
          cp debug.keystore app/debug.keystore || true
          
          # FIX: Generate GRADLE 9.3.1 (not 8.7) - because AGP 9.1.1 needs it!
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 9.3.1
          else
            # Force update existing wrapper to 9.3.1
            ./gradlew wrapper --gradle-version 9.3.1 || gradle wrapper --gradle-version 9.3.1
          fi
          
          # Double check wrapper.properties now points to 9.3.1
          sed -i 's/gradle-.*-bin.zip/gradle-9.3.1-bin.zip/g' gradle/wrapper/gradle-wrapper.properties || true
          cat gradle/wrapper/gradle-wrapper.properties
          
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AlphaFX-APK
          path: "**/build/outputs/apk/debug/*.apk"
