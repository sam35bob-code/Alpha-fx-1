name: Build AlphaFX APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fix Keystore Issue
        run: |
          for f in *.zip; do [ -e "$f" ] && unzip -o "$f" -d . ; done
          ls -la
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          
          # Create the missing debug.keystore that the build expects
          echo "Creating debug.keystore..."
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
          keytool -genkey -v -keystore app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
          keytool -genkey -v -keystore ./debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
          
          # Also ensure my-upload-key.jks exists in app folder
          cp my-upload-key.jks app/ 2>/dev/null || true
          ls -la *.jks *.keystore 2>/dev/null || true
          ls -la app/*.jks app/*.keystore 2>/dev/null || true

      - name: Build APK
        run: |
          # If gradlew missing, create wrapper
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AlphaFX-APK
          path: |
            **/build/outputs/apk/debug/*.apk
