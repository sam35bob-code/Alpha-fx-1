name: Build AlphaFX APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Extract and Build APK
        run: |
          set -x
          pwd
          ls -la
          # Unzip if zip exists
          if ls *.zip 1> /dev/null 2>&1; then
            echo "Found zip, unzipping..."
            unzip -o "*.zip" || unzip -o *.zip
            ls -la
          fi
          if [ -f "alphafx (1).zip" ]; then
            unzip -o "alphafx (1).zip"
            ls -la
          fi
          # Find gradlew anywhere
          echo "--- Searching gradlew ---"
          find . -type f -name "gradlew" | head -20
          GRADLEW_PATH=$(find . -type f -name "gradlew" | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "No gradlew! Listing all files:"
            find . -maxdepth 4 -type f | head -100
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "Building in: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AlphaFX-APK
          path: |
            **/app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
